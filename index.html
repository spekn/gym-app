<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Log</title>
<style>
body{font:16px system-ui;background:#102019;color:#eef5ef;
max-width:700px;margin:40px auto;padding:20px}
section{background:#20372a;padding:24px;border-radius:16px;margin:24px 0}
label{display:block;margin:16px 0}
input,button{font:inherit;padding:10px;border-radius:8px;border:0}
input{display:block;margin-top:6px;box-sizing:border-box;width:100%}
button{background:#bcf882;cursor:pointer}
article{border-top:1px solid #678571;padding:16px 0}
p{line-height:1.6}
</style>
</head>
<body>
<h1>Gym Log</h1>
<p>Track your exercises, sets, reps, and weights.</p>
<section>
<h2>Log an exercise</h2>
<form id="form">
<label>Date<input id="date" type="date" required></label>
<label>Exercise<input id="exercise" required maxlength="100"></label>
<label>Sets<input id="sets" type="number" min="1" max="100" value="3" required></label>
<label>Reps per set<input id="reps" type="number" min="1" max="1000" value="10" required></label>
<label>Weight (kg)<input id="weight" type="number" min="0" max="2000" step="0.1" value="0" required></label>
<button>Save exercise</button>
</form>
<p id="status" role="status"></p>
</section>
<section>
<h2>Workout history</h2>
<p>Records stay in this browser on this device. Clearing browser data can erase them.</p>
<div id="history"></div>
</section>
<script>
"use strict";
const field = id => document.getElementById(id);
const key = "gym-log-v1";
let records = [];
let available = true;
try {
  records = JSON.parse(localStorage.getItem(key) || "[]");
  if (!Array.isArray(records) || !records.every(r =>
    r && typeof r.exercise === "string" &&
    typeof r.date === "string" &&
    [r.sets,r.reps,r.weight].every(Number.isFinite)
  )) throw new Error("Invalid records");
} catch {
  available = false;
  records = [];
  field("status").textContent = "Browser storage is unavailable or saved data could not be read. Saving is disabled.";
  field("form").querySelector("button").disabled = true;
}
const now = new Date();
field("date").value = now.getFullYear() + "-" +
  String(now.getMonth()+1).padStart(2,"0") + "-" +
  String(now.getDate()).padStart(2,"0");

function save(next) {
  if (!available) return false;
  try {
    localStorage.setItem(key, JSON.stringify(next));
    records = next;
    return true;
  } catch {
    field("status").textContent = "Could not save. Browser storage may be disabled or full.";
    return false;
  }
}

function render() {
  field("history").replaceChildren();
  if (!records.length) {
    field("history").textContent = "No exercises logged yet.";
  }
  records.forEach((record,index) => {
    const row = document.createElement("article");
    const title = document.createElement("strong");
    title.textContent = record.exercise;
    const detail = document.createElement("p");
    detail.textContent = record.date + " | " +
      record.sets + " sets x " + record.reps +
      " reps | " + record.weight + " kg";
    const button = document.createElement("button");
    button.textContent = "Delete";
    button.onclick = () => {
      if (confirm("Delete this exercise?") &&
          save(records.filter((_,i) => i !== index))) {
        render();
      }
    };
    row.append(title,detail,button);
    field("history").prepend(row);
  });
}

field("form").onsubmit = event => {
  event.preventDefault();
  const exercise = field("exercise").value.trim();
  if (!exercise) {
    field("status").textContent = "Enter an exercise name.";
    return;
  }
  const record = {
    date: field("date").value,
    exercise,
    sets: Number(field("sets").value),
    reps: Number(field("reps").value),
    weight: Number(field("weight").value)
  };
  if (save([...records,record])) {
    render();
    field("exercise").value = "";
    field("status").textContent = "Exercise saved.";
  }
};
render();
</script>
</body>
</html>
