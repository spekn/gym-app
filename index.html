<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111312">
<title>FORM — Your workout</title>
<style>
:root{color-scheme:dark;--bg:#121114;--panel:#1d1a20;--panel2:#161318;--line:#37313b;--muted:#aaa0ae;--text:#f6f0f7;--accent:#f5a1cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{border-bottom:1px solid var(--line)}.nav{max-width:900px;margin:auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}select{max-width:60%;min-height:38px;border:1px solid #68465b;border-radius:8px;background:#29232d;color:var(--accent);padding:6px 10px}main{max-width:900px;margin:auto;padding:24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}.overview{display:flex;gap:16px;color:var(--muted);font-size:12px}.overview strong{color:var(--text)}.exercise{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.head{display:flex;align-items:center;gap:11px}.num{height:34px;width:34px;flex:0 0 34px;border:1px solid #68465b;color:var(--accent);display:grid;place-items:center;border-radius:9px;font-size:11px}.title{flex:1;min-width:0}.title h3{font-size:17px;margin:0}.title small{color:var(--muted)}.guide-btn{border:1px solid #68465b;background:transparent;color:var(--accent);border-radius:8px;min-height:38px;padding:7px 11px}.guide{display:none;margin:15px 0 4px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px}.guide.open{display:block}.guide-grid{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:18px;align-items:center}.demo{background:#211d23;border-radius:10px;min-height:160px;display:grid;place-items:center;padding:10px}.demo svg{width:100%;max-width:250px;height:145px}.demo .body{stroke:#f6f0f7;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}.demo .equip{stroke:#f5a1cf;stroke-width:5;stroke-linecap:round;fill:none}.demo .arrow{stroke:#aaa0ae;stroke-width:3;fill:none}.demo text{fill:#aaa0ae;font:10px system-ui}.cues h4{margin:0 0 8px;font-size:13px;color:var(--accent)}.cues ol{margin:0;padding-left:20px}.cues li{margin:7px 0;line-height:1.4}.sets{display:flex;flex-direction:column;gap:8px;margin-top:14px}.set{display:grid;grid-template-columns:34px 1fr 1fr 92px 30px;gap:10px;align-items:end;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}.set.done{border-color:#ac6990;background:#2c202a}.set span{align-self:center;color:var(--muted);font-size:11px}.set label{color:var(--muted);font-size:10px}.set input{display:block;width:100%;min-width:0;min-height:40px;margin-top:4px;background:#29232d;border:1px solid #483b4a;border-radius:6px;color:var(--text);font-size:17px;padding:7px}.donebtn,.remove,.add{min-height:40px;border-radius:7px}.donebtn{border:1px solid #68465b;background:transparent;color:var(--accent)}.set.done .donebtn{background:var(--accent);color:#321526}.remove{border:0;background:transparent;color:var(--muted);font-size:20px}.add{border:1px dashed #68465b;background:transparent;color:var(--accent)}.progress{height:3px;background:#37303b;border-radius:4px;margin-top:20px;overflow:hidden}.progress div{height:100%;background:var(--accent)}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;padding:16px 0}#status{color:var(--accent)}
@media(max-width:620px){.nav{height:52px;padding:0 14px}main{padding:18px 12px}.intro{align-items:flex-start;flex-direction:column}.exercise{padding:13px 10px}.guide-grid{grid-template-columns:1fr}.demo{min-height:145px}.set{grid-template-columns:25px 1fr 1fr 54px 22px;gap:6px;padding:7px}.donebtn{font-size:11px;padding:4px}.guide-btn{padding:6px 8px;font-size:12px}footer{flex-direction:column}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">FORM<span> /</span></div><select id="workout-select" aria-label="Select workout"><option value="full-body">Full Body</option><option value="upper">Upper</option><option value="lower">Lower</option><option value="full-body-a">Full Body A · Original</option></select></div></header>
<main><div class="intro"><h1 id="workout-title">Workout</h1><div class="overview"><span><strong id="exercise-count">0</strong> exercises</span><span><strong id="total">0</strong> sets</span><span><strong id="completed">0</strong> done</span></div></div><div id="exercises"></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div><footer><span>kg · 0 = bodyweight · unilateral reps are per side</span><span id="status">Changes save on this device</span></footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s), selector=$('#workout-select'),status=$('#status'),sessions=new Map();let workout=[],activeId='',key='';
const guides={
'Goblet squat':['Hold the weight close to your chest.','Sit down between your hips while keeping your whole foot planted.','Drive the floor away and finish tall.'],
'Seated cable row':['Sit tall with ribs stacked over hips.','Pull the handle toward your lower ribs without leaning back.','Reach forward under control and repeat.'],
'Assisted push ups':['Set hands just outside shoulder width and keep a straight body line.','Lower chest toward the support with elbows angled back.','Press away without letting the hips sag.'],
'Glute bridge':['Lie on your back with feet planted near your hips.','Brace, then drive through the feet and squeeze the glutes.','Finish with ribs down; lower under control.'],
'Landmine rotational press':['Start with the bar at one shoulder in an athletic stance.','Rotate through hips and torso as you press up and across.','Control the bar back to the starting shoulder.'],
'Plank dumbbell drag':['Set a strong high plank with feet slightly wider than hips.','Reach the opposite hand under your body and drag the dumbbell across.','Keep hips as square and quiet as possible.'],
'Uneven farmer march':['Hold different loads at your sides and stand tall.','Brace against the uneven pull and slowly lift one knee.','Alternate without leaning or rushing.'],
'Romanian deadlift':['Soften the knees and push your hips straight back.','Keep the weight close and spine long as hamstrings load.','Drive hips forward to stand tall.'],
'Bulgarian split squat':['Place the rear foot on a bench and establish a stable front foot.','Drop mostly straight down while the front knee tracks over the toes.','Push through the front foot to rise.'],
'Cable step-up':['Face the step with cable resistance controlled.','Plant the full working foot and step up without pushing off the trailing leg.','Own the top position, then lower slowly.'],
'Single-leg RDL to knee drive':['Balance on one leg and hinge by sending the free leg behind you.','Keep hips square while reaching a long line head-to-heel.','Stand tall and drive the free knee forward.'],
'Heavy suitcase march':['Hold one heavy weight at your side.','Stand tall and resist leaning toward or away from the load.','March slowly, pausing briefly on each leg.'],
'Sit ups':['Lie back with knees bent and feet anchored lightly.','Exhale and curl the torso up without yanking the neck.','Lower with control.'],
'Sit up':['Lie back with knees bent and feet anchored lightly.','Exhale and curl the torso up without yanking the neck.','Lower with control.'],
'Around the world':['Hold a light plate or kettlebell close to the body.','Circle it smoothly around your head while keeping ribs down.','Reverse direction and keep the neck relaxed.'],
'Lat pulldown':['Set shoulders down and sit tall.','Pull the bar toward the upper chest by driving elbows down.','Return overhead slowly without shrugging.'],
'Incline dumbbell press':['Set shoulder blades against the bench and feet firmly down.','Lower dumbbells beside the upper chest.','Press up and slightly inward while keeping shoulders controlled.'],
'Half-kneeling one-arm landmine press':['Kneel with the opposite foot forward and squeeze the rear glute.','Brace the trunk and press the bar forward and up.','Avoid arching or rotating as you return.'],
'Renegade row':['Take a wide, strong plank over the dumbbells.','Row one dumbbell toward your ribs.','Resist torso rotation and alternate sides.'],
'Cable chop':['Stand side-on to the cable with hands together.','Rotate through the trunk and hips as you guide the handle diagonally across.','Return slowly without letting the stack pull you back.'],
'Cable step-ups':['Plant the full working foot on the box.','Drive through that leg while keeping the pelvis level.','Lower slowly and repeat on the same side.'],
'One-legged RDL':['Balance on one leg and send the other leg behind you.','Hinge until you feel the standing hamstring load while hips stay square.','Drive the hip forward to stand.']};
function art(name){const n=name.toLowerCase(),squat=n.includes('squat')||n.includes('step'),hinge=n.includes('rdl')||n.includes('deadlift')||n.includes('bridge'),press=n.includes('press')||n.includes('push'),pull=n.includes('row')||n.includes('pulldown'),core=n.includes('sit')||n.includes('plank')||n.includes('chop')||n.includes('around'),march=n.includes('march');let pose=squat?'squat':hinge?'hinge':press?'press':pull?'pull':core?'core':march?'march':'stand';const poses={stand:'<circle class="body" cx="72" cy="34" r="12"/><path class="body" d="M72 47v43M72 60L45 78M72 60l27 18M72 90l-20 38M72 90l22 38"/>',squat:'<circle class="body" cx="67" cy="42" r="12"/><path class="body" d="M68 55l8 37M73 68L48 82M76 68l25 12M76 92l-30 17M46 109l-15 25M76 92l28 18M104 110l18 22"/>',hinge:'<circle class="body" cx="57" cy="48" r="12"/><path class="body" d="M67 55l45 24M82 63L63 91M112 79l-8 49M112 79l34 35"/>',press:'<circle class="body" cx="67" cy="52" r="12"/><path class="body" d="M68 65v48M68 77L45 96M68 77l35-45M68 113l-22 25M68 113l25 25"/><path class="equip" d="M98 37l13-13M104 30l10 10"/>',pull:'<circle class="body" cx="72" cy="42" r="12"/><path class="body" d="M72 55v58M72 70L42 83M72 70l31 13M72 113l-24 25M72 113l24 25"/><path class="equip" d="M20 82h26M99 82h34"/>',core:'<circle class="body" cx="58" cy="86" r="12"/><path class="body" d="M68 80l44-25M80 73L57 57M112 55l34 25M112 55l17-37"/>',march:'<circle class="body" cx="72" cy="34" r="12"/><path class="body" d="M72 47v48M72 60L47 76M72 60l25 16M72 95l-22 38M72 95l31 5M103 100l12 27"/><path class="equip" d="M42 76v38"/>'};return `<svg viewBox="0 0 180 150" role="img" aria-label="Schematic movement illustration"><path class="arrow" d="M145 25h24m-8-7 8 7-8 7"/>${poses[pose]}<text x="112" y="145">start → move → return</text></svg>`}
function guideFor(name){return guides[name]||['Set a stable starting position and brace before moving.','Move through a comfortable, controlled range without momentum.','Keep the return phase slow and stop if the movement causes pain.']}
function valid(data){return Array.isArray(data)&&data.length&&data.every(e=>e?.name&&Array.isArray(e.sets)&&e.sets.length)}
async function load(id){status.textContent='Loading…';try{let s=sessions.get(id);if(!s){const r=await fetch(`workouts/${id}.json`);if(!r.ok)throw Error();const t=await r.json();if(!valid(t.exercises))throw Error();key=id==='full-body-a'?'form-workout-a-v2':`form-workout-${id}-v2`;let ex=t.exercises.map(e=>({name:e.name,sets:e.sets.map(x=>({...x,done:false}))}));try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved)&&saved.length===ex.length&&saved.every((e,i)=>e.name===ex[i].name))ex=saved}catch{}s={name:t.name,ex,key};sessions.set(id,s)}activeId=id;key=s.key;workout=s.ex;$('#workout-title').textContent=s.name;render();localStorage.setItem('form-selected-workout',id);status.textContent='Changes save on this device'}catch{status.textContent='Could not load workout'}}
function save(){try{localStorage.setItem(key,JSON.stringify(workout));status.textContent='Saved on this device'}catch{status.textContent='Could not save changes'}}
function summary(){const sets=workout.flatMap(e=>e.sets),done=sets.filter(s=>s.done).length;$('#exercise-count').textContent=workout.length;$('#total').textContent=sets.length;$('#completed').textContent=done;const p=sets.length?Math.round(done/sets.length*100):0;$('#progress-fill').style.width=p+'%';$('.progress').setAttribute('aria-valuenow',p)}
function render(){const root=$('#exercises');root.replaceChildren();workout.forEach((e,ei)=>{const sec=document.createElement('section');sec.className='exercise';const cues=guideFor(e.name);sec.innerHTML=`<div class="head"><div class="num">${String(ei+1).padStart(2,'0')}</div><div class="title"><h3>${e.name}</h3><small>${e.sets.length} sets</small></div><button class="guide-btn" type="button" aria-expanded="false">▶ How to</button></div><div class="guide"><div class="guide-grid"><div class="demo">${art(e.name)}</div><div class="cues"><h4>Movement cues</h4><ol>${cues.map(c=>`<li>${c}</li>`).join('')}</ol></div></div></div><div class="sets"></div>`;const guide=sec.querySelector('.guide'),gb=sec.querySelector('.guide-btn');gb.onclick=()=>{const open=guide.classList.toggle('open');gb.textContent=open?'▼ Hide guide':'▶ How to';gb.setAttribute('aria-expanded',open)};const rows=sec.querySelector('.sets');e.sets.forEach((s,si)=>{const row=document.createElement('div');row.className='set'+(s.done?' done':'');row.innerHTML=`<span>${si+1}</span><label>Reps<input type="number" min="1" max="1000" step="1" value="${s.reps}"></label><label>Weight · kg<input type="number" min="0" max="2000" step="0.1" value="${s.weight}"></label><button class="donebtn" type="button">${s.done?'✓ Done':'○ Done'}</button><button class="remove" type="button" aria-label="Remove set">×</button>`;const ins=row.querySelectorAll('input');ins[0].onchange=()=>{const v=Number(ins[0].value);if(Number.isInteger(v)&&v>0&&v<=1000){s.reps=v;save()}};ins[1].onchange=()=>{const v=Number(ins[1].value);if(Number.isFinite(v)&&v>=0&&v<=2000){s.weight=v;save()}};row.querySelector('.donebtn').onclick=()=>{s.done=!s.done;save();render()};row.querySelector('.remove').onclick=()=>{if(e.sets.length>1){e.sets.splice(si,1);save();render()}};rows.append(row)});const add=document.createElement('button');add.className='add';add.type='button';add.textContent='+ Add set';add.onclick=()=>{const x=e.sets.at(-1);e.sets.push({reps:x.reps,weight:x.weight,done:false});save();render()};rows.append(add);root.append(sec)});summary()}
selector.onchange=()=>load(selector.value);let initial='full-body';try{const s=localStorage.getItem('form-selected-workout');if([...selector.options].some(o=>o.value===s))initial=s}catch{}selector.value=initial;load(initial);
</script>
</body>
</html>
