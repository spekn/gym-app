<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111312"><title>FORM — Your workout</title>
<style>
:root{color-scheme:dark;--bg:#121114;--panel:#1d1a20;--panel2:#161318;--line:#37313b;--muted:#aaa0ae;--text:#f6f0f7;--accent:#f5a1cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{border-bottom:1px solid var(--line)}.nav{max-width:900px;margin:auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:23px;font-weight:900}.brand span{color:var(--accent)}select{max-width:60%;min-height:38px;border:1px solid #68465b;border-radius:8px;background:#29232d;color:var(--accent);padding:6px 10px}main{max-width:900px;margin:auto;padding:24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}.overview{display:flex;gap:16px;color:var(--muted);font-size:12px}.overview strong{color:var(--text)}.exercise{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.head{display:flex;align-items:center;gap:11px}.num{height:34px;width:34px;flex:0 0 34px;border:1px solid #68465b;color:var(--accent);display:grid;place-items:center;border-radius:9px;font-size:11px}.title{flex:1;min-width:0}.title h3{font-size:17px;margin:0}.title small{color:var(--muted)}.guide-btn{border:1px solid #68465b;background:transparent;color:var(--accent);border-radius:8px;min-height:38px;padding:7px 11px}.guide{display:none;margin:15px 0 4px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px}.guide.open{display:block}.guide-grid{display:grid;grid-template-columns:minmax(240px,1.15fr) 1fr;gap:18px;align-items:start}.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px}.poses img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#29232d}.pose-label{text-align:center;color:var(--muted);font-size:10px;margin-top:4px}.guide h4{margin:0 0 8px;font-size:13px;color:var(--accent)}.guide ol{margin:0;padding-left:20px}.guide li{margin:7px 0;line-height:1.4}.source{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5}.source a{margin-right:10px}.fallback{padding:20px;border:1px dashed #68465b;border-radius:9px;color:var(--muted);line-height:1.5}.sets{display:flex;flex-direction:column;gap:8px;margin-top:14px}.set{display:grid;grid-template-columns:34px 1fr 1fr 92px 30px;gap:10px;align-items:end;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}.set.done{border-color:#ac6990;background:#2c202a}.set>span{align-self:center;color:var(--muted);font-size:11px}.set label{color:var(--muted);font-size:10px}.set input{display:block;width:100%;min-width:0;min-height:40px;margin-top:4px;background:#29232d;border:1px solid #483b4a;border-radius:6px;color:var(--text);font-size:17px;padding:7px}.donebtn,.remove,.add{min-height:40px;border-radius:7px}.donebtn{border:1px solid #68465b;background:transparent;color:var(--accent)}.set.done .donebtn{background:var(--accent);color:#321526}.remove{border:0;background:transparent;color:var(--muted);font-size:20px}.add{border:1px dashed #68465b;background:transparent;color:var(--accent)}.progress{height:3px;background:#37303b;border-radius:4px;margin-top:20px;overflow:hidden}.progress div{height:100%;background:var(--accent)}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;padding:16px 0}#status{color:var(--accent)}
@media(max-width:620px){.nav{height:52px;padding:0 14px}main{padding:18px 12px}.intro{align-items:flex-start;flex-direction:column}.exercise{padding:13px 10px}.guide-grid{grid-template-columns:1fr}.set{grid-template-columns:25px 1fr 1fr 54px 22px;gap:6px;padding:7px}.donebtn{font-size:11px;padding:4px}.guide-btn{padding:6px 8px;font-size:12px}footer{flex-direction:column}}
</style></head><body>
<header><div class="nav"><div class="brand">FORM<span> /</span></div><select id="workout-select" aria-label="Select workout"><option value="full-body">Full Body</option><option value="upper">Upper</option><option value="lower">Lower</option></select></div></header>
<main><div class="intro"><h1 id="workout-title">Workout</h1><div class="overview"><span><strong id="exercise-count">0</strong> exercises</span><span><strong id="total">0</strong> sets</span><span><strong id="completed">0</strong> done</span></div></div><div id="exercises"></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div><footer><span>kg · 0 = bodyweight · unilateral reps are per side</span><span><a href="https://repdb.co" target="_blank" rel="nofollow noopener">Exercise data by RepDB</a> · <span id="status">Changes save on this device</span></span></footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s),selector=$('#workout-select'),status=$('#status'),sessions=new Map();let workout=[],key='',repdb=[];
const REP='https://exercise-dataset.com/';
const motra={'Goblet squat':'https://www.motra.com/exercises/gobletSquat'};
const aliases={'Goblet squat':'Dumbbell Goblet Squat','Assisted push ups':'Incline Push Up','Landmine rotational press':'Landmine Press','Plank dumbbell drag':'Dumbbell Plank Drag','Uneven farmer march':'Suitcase Carry','Cable step-up':'Step Up','Single-leg RDL to knee drive':'Single Leg Romanian Deadlift','Heavy suitcase march':'Suitcase Carry','Sit ups':'Sit Up','Sit up':'Sit Up','Around the world':'Kettlebell Around the World','Incline dumbbell press':'Incline Dumbbell Bench Press','Half-kneeling one-arm landmine press':'Half Kneeling Landmine Press','Cable chop':'Cable Wood Chop'};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(one|arm|heavy|uneven|assisted)\b/g,' ').replace(/\s+/g,' ').trim();
function score(a,b){a=new Set(norm(a).split(' '));b=new Set(norm(b).split(' '));let hit=0;a.forEach(x=>{if(b.has(x))hit++});return hit/Math.max(a.size,b.size)}
function findRep(name){if(!repdb.length)return null;const wanted=aliases[name]||name;let best=null,bestScore=0;for(const x of repdb){const s=score(wanted,x.name_en);if(s>bestScore){best=x;bestScore=s}}return bestScore>=.5?best:null}
async function loadRepDB(){try{const r=await fetch(REP+'exercises.json');if(!r.ok)throw Error();const d=await r.json();repdb=Array.isArray(d.exercises)?d.exercises:[];if(workout.length)render()}catch{repdb=[]}}
function valid(data){return Array.isArray(data)&&data.length&&data.every(e=>e?.name&&Array.isArray(e.sets)&&e.sets.length)}
async function load(id){status.textContent='Loading…';try{let s=sessions.get(id);if(!s){const r=await fetch(`workouts/${id}.json`);if(!r.ok)throw Error();const t=await r.json();if(!valid(t.exercises))throw Error();key=`form-workout-${id}-v2`;let ex=t.exercises.map(e=>({name:e.name,sets:e.sets.map(x=>({...x,done:false}))}));try{const saved=JSON.parse(localStorage.getItem(key));if(valid(saved)&&saved.length===ex.length&&saved.every((e,i)=>e.name===ex[i].name))ex=saved}catch{}s={name:t.name,ex,key};sessions.set(id,s)}key=s.key;workout=s.ex;$('#workout-title').textContent=s.name;render();localStorage.setItem('form-selected-workout',id);status.textContent='Changes save on this device'}catch{status.textContent='Could not load workout'}}
function save(){try{localStorage.setItem(key,JSON.stringify(workout));status.textContent='Saved on this device'}catch{status.textContent='Could not save changes'}}
function summary(){const sets=workout.flatMap(e=>e.sets),done=sets.filter(s=>s.done).length;$('#exercise-count').textContent=workout.length;$('#total').textContent=sets.length;$('#completed').textContent=done;const p=sets.length?Math.round(done/sets.length*100):0;$('#progress-fill').style.width=p+'%';$('.progress').setAttribute('aria-valuenow',p)}
function guideHTML(name){const x=findRep(name),m=motra[name]||'https://www.motra.com/exercises';if(!x)return `<div class="fallback">No confident RepDB match found for this exact variation.<br><a href="${m}" target="_blank" rel="noopener">Open Motra exercise library ↗</a></div>`;const imgs=x.images?.flat||{},paths=imgs.start&&imgs.peak?[['Start',imgs.start],['Peak',imgs.peak]]:imgs.main?[['Position',imgs.main]]:[];const pictures=paths.length?`<div class="poses">${paths.map(([l,p])=>`<div><img loading="lazy" src="${REP+p}" alt="${x.name_en} — ${l.toLowerCase()} position"><div class="pose-label">${l}</div></div>`).join('')}</div>`:'<div class="fallback">Illustration unavailable.</div>';const steps=(x.instructions_en||[]).slice(0,5);return `<div class="guide-grid"><div>${pictures}</div><div><h4>${x.name_en}${norm(x.name_en)!==norm(name)?' · closest match':''}</h4>${steps.length?`<ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}<div class="source"><a href="${REP}exercise/${x.id}/" target="_blank" rel="noopener">RepDB guide ↗</a><a href="${m}" target="_blank" rel="noopener">Motra backup ↗</a></div></div></div>`}
function render(){const root=$('#exercises');root.replaceChildren();workout.forEach((e,ei)=>{const sec=document.createElement('section');sec.className='exercise';sec.innerHTML=`<div class="head"><div class="num">${String(ei+1).padStart(2,'0')}</div><div class="title"><h3>${e.name}</h3><small>${e.sets.length} sets</small></div><button class="guide-btn" type="button" aria-expanded="false">▶ How to</button></div><div class="guide">${guideHTML(e.name)}</div><div class="sets"></div>`;const guide=sec.querySelector('.guide'),gb=sec.querySelector('.guide-btn');gb.onclick=()=>{const open=guide.classList.toggle('open');gb.textContent=open?'▼ Hide guide':'▶ How to';gb.setAttribute('aria-expanded',open)};const rows=sec.querySelector('.sets');e.sets.forEach((s,si)=>{const row=document.createElement('div');row.className='set'+(s.done?' done':'');row.innerHTML=`<span>${si+1}</span><label>Reps<input type="number" min="1" max="1000" step="1" value="${s.reps}"></label><label>Weight · kg<input type="number" min="0" max="2000" step="0.1" value="${s.weight}"></label><button class="donebtn" type="button">${s.done?'✓ Done':'○ Done'}</button><button class="remove" type="button" aria-label="Remove set">×</button>`;const ins=row.querySelectorAll('input');ins[0].onchange=()=>{const v=Number(ins[0].value);if(Number.isInteger(v)&&v>0&&v<=1000){s.reps=v;save()}};ins[1].onchange=()=>{const v=Number(ins[1].value);if(Number.isFinite(v)&&v>=0&&v<=2000){s.weight=v;save()}};row.querySelector('.donebtn').onclick=()=>{s.done=!s.done;save();render()};row.querySelector('.remove').onclick=()=>{if(e.sets.length>1){e.sets.splice(si,1);save();render()}};rows.append(row)});const add=document.createElement('button');add.className='add';add.type='button';add.textContent='+ Add set';add.onclick=()=>{const x=e.sets.at(-1);e.sets.push({reps:x.reps,weight:x.weight,done:false});save();render()};rows.append(add);root.append(sec)});summary()}
selector.onchange=()=>load(selector.value);let initial='full-body';try{const s=localStorage.getItem('form-selected-workout');if([...selector.options].some(o=>o.value===s))initial=s}catch{}selector.value=initial;load(initial);loadRepDB();
</script></body></html>
