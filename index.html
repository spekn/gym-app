<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111312"><title>FORM — Your workout</title>
<style>
:root{color-scheme:dark;--bg:#121114;--panel:#1d1a20;--panel2:#161318;--line:#37313b;--muted:#aaa0ae;--text:#f6f0f7;--accent:#f5a1cf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{border-bottom:1px solid var(--line)}.nav{max-width:900px;margin:auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:23px;font-weight:900}.brand span{color:var(--accent)}select{max-width:60%;min-height:38px;border:1px solid #68465b;border-radius:8px;background:#29232d;color:var(--accent);padding:6px 10px}main{max-width:900px;margin:auto;padding:24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}.overview{display:flex;gap:16px;color:var(--muted);font-size:12px}.overview strong{color:var(--text)}.exercise{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}.head{display:flex;align-items:center;gap:11px}.num{height:34px;width:34px;flex:0 0 34px;border:1px solid #68465b;color:var(--accent);display:grid;place-items:center;border-radius:9px;font-size:11px}.title{flex:1;min-width:0}.title h3{font-size:17px;margin:0}.title small{color:var(--muted)}.guide-btn{border:1px solid #68465b;background:transparent;color:var(--accent);border-radius:8px;min-height:38px;padding:7px 11px}.guide{display:none;margin:15px 0 4px;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:14px}.guide.open{display:block}.guide-grid{display:grid;grid-template-columns:minmax(240px,1.15fr) 1fr;gap:18px;align-items:start}.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px}.poses img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#29232d}.pose-label{text-align:center;color:var(--muted);font-size:10px;margin-top:4px}.guide h4{margin:0 0 8px;font-size:13px;color:var(--accent)}.guide ol{margin:0;padding-left:20px}.guide li{margin:7px 0;line-height:1.4}.source{margin-top:12px;font-size:11px;color:var(--muted);line-height:1.5}.source a{margin-right:10px}.fallback{padding:20px;border:1px dashed #68465b;border-radius:9px;color:var(--muted);line-height:1.5}.sets{display:flex;flex-direction:column;gap:8px;margin-top:14px}.set{display:grid;grid-template-columns:34px 1fr 1fr 92px 30px;gap:10px;align-items:end;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px}.set.done{border-color:#ac6990;background:#2c202a}.set>span{align-self:center;color:var(--muted);font-size:11px}.set label{color:var(--muted);font-size:10px}.set input{display:block;width:100%;min-width:0;min-height:40px;margin-top:4px;background:#29232d;border:1px solid #483b4a;border-radius:6px;color:var(--text);font-size:17px;padding:7px}.donebtn,.remove,.add{min-height:40px;border-radius:7px}.donebtn{border:1px solid #68465b;background:transparent;color:var(--accent)}.set.done .donebtn{background:var(--accent);color:#321526}.remove{border:0;background:transparent;color:var(--muted);font-size:20px}.add{border:1px dashed #68465b;background:transparent;color:var(--accent)}.progress{height:3px;background:#37303b;border-radius:4px;margin-top:20px;overflow:hidden}.progress div{height:100%;background:var(--accent)}footer{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;padding:16px 0}#status{color:var(--accent)}
@media(max-width:620px){.nav{height:52px;padding:0 14px}main{padding:18px 12px}.intro{align-items:flex-start;flex-direction:column}.exercise{padding:13px 10px}.guide-grid{grid-template-columns:1fr}.set{grid-template-columns:25px 1fr 1fr 54px 22px;gap:6px;padding:7px}.donebtn{font-size:11px;padding:4px}.guide-btn{padding:6px 8px;font-size:12px}footer{flex-direction:column}}

.name-btn{border:0;background:none;color:inherit;font:inherit;text-align:left;padding:7px 0;width:100%;overflow-wrap:anywhere}.name-btn:hover{color:var(--accent)}.name-btn span{color:var(--accent);font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.drag-handle{touch-action:none;border:0;background:none;color:var(--accent);min-width:30px;min-height:44px;font-size:22px;cursor:grab}.dragging{opacity:.5}.drop-target{outline:2px solid var(--accent)}.rename-form{display:flex;gap:6px;flex-wrap:wrap}.rename-form input{width:100%;min-width:0;background:var(--panel2);color:var(--text);border:1px solid var(--accent);border-radius:6px;padding:8px}.alternatives{margin-top:12px}.alternatives label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.alternatives select{max-width:100%;width:100%}[hidden]{display:none!important}.head .title{min-width:100px}.head{flex-wrap:wrap}.title small{display:block}
@media(max-width:620px){.head{gap:7px}.actions{margin-left:auto}.head .num{display:none}.guide-btn{min-height:40px}.title{flex-basis:calc(100% - 50px)}}
</style></head><body>
<header><div class="nav"><div class="brand">FORM<span> /</span></div><select id="workout-select" aria-label="Select workout"><option value="full-body">Full Body</option><option value="upper">Upper</option><option value="lower">Lower</option></select></div></header>
<main><div class="intro"><h1 id="workout-title">Workout</h1><div class="overview"><span><strong id="exercise-count">0</strong> exercises</span><span><strong id="total">0</strong> sets</span><span><strong id="completed">0</strong> done</span></div></div><div id="exercises"></div><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div><footer><span>kg · 0 = bodyweight · unilateral reps are per side</span><span><a href="https://repdb.co" target="_blank" rel="nofollow noopener">Exercise data by RepDB</a> · <span id="status">Changes save on this device</span></span></footer></main>
<script>
'use strict';
const $=s=>document.querySelector(s),selector=$('#workout-select'),status=$('#status'),sessions=new Map();let workout=[],key='',repdb=[];
const REP='https://exercise-dataset.com/';
const motra={'Goblet squat':'https://www.motra.com/exercises/gobletSquat'};
const aliases={'Goblet squat':'Dumbbell Goblet Squat','Assisted push ups':'Incline Push Up','Landmine rotational press':'Landmine Press','Plank dumbbell drag':'Dumbbell Plank Drag','Uneven farmer march':'Suitcase Carry','Cable step-up':'Step Up','Single-leg RDL to knee drive':'Single Leg Romanian Deadlift','Heavy suitcase march':'Suitcase Carry','Sit ups':'Sit Up','Sit up':'Sit Up','Around the world':'Kettlebell Around the World','Incline dumbbell press':'Incline Dumbbell Bench Press','Half-kneeling one-arm landmine press':'Half Kneeling Landmine Press','Cable chop':'Cable Wood Chop'};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\b(one|arm|heavy|uneven|assisted)\b/g,' ').replace(/\s+/g,' ').trim();
function score(a,b){a=new Set(norm(a).split(' '));b=new Set(norm(b).split(' '));let hit=0;a.forEach(x=>{if(b.has(x))hit++});return hit/Math.max(a.size,b.size)}
function findRep(name){if(!repdb.length)return null;const wanted=aliases[name]||name;let best=null,bestScore=0;for(const x of repdb){const s=score(wanted,x.name_en);if(s>bestScore){best=x;bestScore=s}}return bestScore>=.5?best:null}
async function loadRepDB(){try{const r=await fetch(REP+'exercises.json');if(!r.ok)throw Error();const d=await r.json();repdb=Array.isArray(d.exercises)?d.exercises:[];if(workout.length&&!document.querySelector('.rename-form,.dragging'))render()}catch{repdb=[]}}
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(data){return Array.isArray(data)&&data.length>0&&data.every(e=>e&&typeof e.name==='string'&&e.name.trim()&&Array.isArray(e.sets)&&e.sets.length>0&&e.sets.every(s=>s&&Number.isInteger(s.reps)&&s.reps>0&&s.reps<=1000&&Number.isFinite(s.weight)&&s.weight>=0&&s.weight<=2000));}
let activeId='',loading=false;
async function load(id){if(loading)return;loading=true;selector.disabled=true;status.textContent='Loading…';try{
 let session=sessions.get(id);
 if(!session){
  const r=await fetch(`workouts/${id}.json`);if(!r.ok)throw Error();const t=await r.json();if(!valid(t.exercises))throw Error();
  const nextKey=`form-workout-${id}-v2`;
  const base=t.exercises.map((e,i)=>({...e,id:e.id||`${id}-${i}`,originalName:e.name,alternatives:(e.alternatives||[]).map(a=>typeof a==='string'?a:a.name).filter(n=>typeof n==='string'&&n.trim()),sets:e.sets.map(x=>({...x,done:false}))}));
  if(new Set(base.map(e=>e.id)).size!==base.length)throw Error();
  let ex=base,readable=true;
  try{const saved=JSON.parse(localStorage.getItem(nextKey));if(saved!==null){
   if(!valid(saved)||saved.length!==base.length)throw Error();
   const used=new Set();
   ex=saved.map((e,i)=>{const original=e.id?base.find(b=>b.id===e.id):base[i];if(!original||used.has(original.id)||(!e.id&&e.name!==original.name))throw Error();used.add(original.id);return {...original,name:e.name,guideOpen:e.guideOpen===true,sets:e.sets.map(x=>({...x,done:x.done===true}))};});
  }}catch{readable=false;}
  session={name:t.name,ex,key:nextKey,readable};sessions.set(id,session);
 }
 key=session.key;workout=session.ex;activeId=id;selector.value=id;$('#workout-title').textContent=session.name;render();
 try{localStorage.setItem('form-selected-workout',id);}catch{}
 status.textContent=session.readable?'Changes save on this device':'Saved data could not be read. Existing saved data is protected; changes last this session.';
 }catch{selector.value=activeId||id;status.textContent='Could not load workout. Current workout unchanged.';}finally{loading=false;selector.disabled=false;}}
function save(){if(sessions.get(activeId)?.readable===false)return;try{localStorage.setItem(key,JSON.stringify(workout));status.textContent='Saved on this device'}catch{status.textContent='Could not save changes'}}
function summary(){const sets=workout.flatMap(e=>e.sets),done=sets.filter(s=>s.done).length;$('#exercise-count').textContent=workout.length;$('#total').textContent=sets.length;$('#completed').textContent=done;const p=sets.length?Math.round(done/sets.length*100):0;$('#progress-fill').style.width=p+'%';$('.progress').setAttribute('aria-valuenow',p)}
function guideHTML(name){const x=findRep(name),m=motra[name]||'https://www.motra.com/exercises';if(!x)return `<div class="fallback">No confident RepDB match found for this exact variation.<br><a href="${m}" target="_blank" rel="noopener">Open Motra exercise library ↗</a></div>`;const imgs=x.images?.flat||{},paths=imgs.start&&imgs.peak?[['Start',imgs.start],['Peak',imgs.peak]]:imgs.main?[['Position',imgs.main]]:[];const pictures=paths.length?`<div class="poses">${paths.map(([l,p])=>`<div><img loading="lazy" src="${REP+p}" alt="${x.name_en} — ${l.toLowerCase()} position"><div class="pose-label">${l}</div></div>`).join('')}</div>`:'<div class="fallback">Illustration unavailable.</div>';const steps=(x.instructions_en||[]).slice(0,5);return `<div class="guide-grid"><div>${pictures}</div><div><h4>${x.name_en}${norm(x.name_en)!==norm(name)?' · closest match':''}</h4>${steps.length?`<ol>${steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}<div class="source"><a href="${REP}exercise/${x.id}/" target="_blank" rel="noopener">RepDB guide ↗</a><a href="${m}" target="_blank" rel="noopener">Motra backup ↗</a></div></div></div>`}
function moveExercise(from,to){if(from===to||to<0||to>=workout.length)return;const [exercise]=workout.splice(from,1);workout.splice(to,0,exercise);save();render();status.textContent=`${exercise.name} moved to position ${to+1}`;document.querySelectorAll('.drag-handle')[to]?.focus();}
function attachDrag(handle,section,index){
 handle.onkeydown=event=>{if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();moveExercise(index,index+(event.key==='ArrowUp'?-1:1));}};
 handle.onpointerdown=event=>{if(event.button!==0)return;event.preventDefault();handle.setPointerCapture(event.pointerId);let target=index,startY=event.clientY;section.classList.add('dragging');
 const clean=()=>{section.classList.remove('dragging');document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));handle.onpointermove=handle.onpointerup=handle.onpointercancel=null;};
 handle.onpointermove=ev=>{const cards=[...document.querySelectorAll('.exercise')];document.querySelectorAll('.drop-target').forEach(e=>e.classList.remove('drop-target'));const hit=cards.findIndex(card=>{const r=card.getBoundingClientRect();return ev.clientY>=r.top&&ev.clientY<=r.bottom;});if(hit>=0){target=hit;cards[hit].classList.add('drop-target');}if(ev.clientY<65)window.scrollBy(0,-18);else if(ev.clientY>innerHeight-65)window.scrollBy(0,18);};
 handle.onpointerup=ev=>{const dragged=Math.abs(ev.clientY-startY)>5;clean();if(dragged)moveExercise(index,target);};handle.onpointercancel=clean;
 };
}
function render(){const root=$('#exercises');root.replaceChildren();workout.forEach((e,ei)=>{
 const sec=document.createElement('section');sec.className='exercise';
 sec.innerHTML=`<div class="head"><button type="button" class="drag-handle" aria-label="Reorder ${esc(e.name)}" title="Drag to reorder; use arrow keys when focused">⠿</button><div class="num">${String(ei+1).padStart(2,'0')}</div><div class="title"><h3><button type="button" class="name-btn" aria-label="Edit ${esc(e.name)}">${esc(e.name)} <span aria-hidden="true">✎</span></button></h3><small>${e.sets.length} sets</small></div><div class="actions"><button class="guide-btn howto" type="button" aria-expanded="${!!e.guideOpen}">${e.guideOpen?'▼ Hide guide':'▶ How to'}</button>${e.alternatives.length?'<button type="button" class="guide-btn alt-btn" aria-expanded="false">⇄ Alternatives</button>':''}</div></div><div class="alternatives" hidden></div><div class="guide${e.guideOpen?' open':''}"></div><div class="sets"></div>`;
 const guide=sec.querySelector('.guide'),gb=sec.querySelector('.howto');guide.innerHTML=guideHTML(e.name);
 gb.onclick=()=>{e.guideOpen=!e.guideOpen;save();render();};
 attachDrag(sec.querySelector('.drag-handle'),sec,ei);
 sec.querySelector('.name-btn').onclick=()=>{
  const title=sec.querySelector('.title'),form=document.createElement('form');form.className='rename-form';
  const input=document.createElement('input');input.value=e.name;input.required=true;input.maxLength=100;input.setAttribute('aria-label','Exercise name');
  const commit=document.createElement('button');commit.type='submit';commit.className='guide-btn';commit.textContent='Save';
  const cancel=document.createElement('button');cancel.type='button';cancel.className='guide-btn';cancel.textContent='Cancel';cancel.onclick=()=>render();
  form.append(input,commit,cancel);title.replaceChildren(form);input.focus();input.select();
  form.onsubmit=event=>{event.preventDefault();const name=input.value.trim();if(!name){input.setCustomValidity('Enter an exercise name.');input.reportValidity();return;}e.name=name;save();render();};input.oninput=()=>input.setCustomValidity('');input.onkeydown=event=>{if(event.key==='Escape'){event.preventDefault();render();}};
 };
 if(e.alternatives.length){const panel=sec.querySelector('.alternatives'),button=sec.querySelector('.alt-btn');const label=document.createElement('label');label.textContent='Choose an exercise (keeps reps and weight; clears completion)';const select=document.createElement('select');select.setAttribute('aria-label','Alternative for '+e.name);const options=[...new Set([e.name,e.originalName,...e.alternatives])];options.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;select.append(option);});select.onchange=()=>{e.name=select.value;e.sets.forEach(s=>s.done=false);save();render();};label.append(select);panel.append(label);button.onclick=()=>{panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)select.focus();};}
 const rows=sec.querySelector('.sets');e.sets.forEach((s,si)=>{const row=document.createElement('div');row.className='set'+(s.done?' done':'');row.innerHTML=`<span>${si+1}</span><label>Reps<input aria-label="${esc(e.name)}, set ${si+1}, reps" required type="number" min="1" max="1000" step="1" value="${s.reps}"></label><label>Weight · kg<input aria-label="${esc(e.name)}, set ${si+1}, weight" required type="number" min="0" max="2000" step="0.1" value="${s.weight}"></label><button class="donebtn" type="button" aria-pressed="${s.done}">${s.done?'✓ Done':'○ Done'}</button><button class="remove" type="button" aria-label="Remove set" ${e.sets.length===1?'disabled':''}>×</button>`;
 row.querySelectorAll('input').forEach((input,i)=>{input.oninput=()=>{if(input.checkValidity()){s[i===0?'reps':'weight']=input.valueAsNumber;save();}};input.onblur=()=>{if(!input.checkValidity())input.value=s[i===0?'reps':'weight'];};});
 row.querySelector('.donebtn').onclick=()=>{if(![...row.querySelectorAll('input')].every(input=>input.reportValidity()))return;s.done=!s.done;save();render();};row.querySelector('.remove').onclick=()=>{if(e.sets.length>1){e.sets.splice(si,1);save();render();}};rows.append(row);
 });const add=document.createElement('button');add.className='add';add.type='button';add.textContent='+ Add set';add.onclick=()=>{const x=e.sets.at(-1);e.sets.push({reps:x.reps,weight:x.weight,done:false});save();render();};rows.append(add);root.append(sec);
 });summary();}
selector.onchange=()=>load(selector.value);let initial='full-body';try{const s=localStorage.getItem('form-selected-workout');if([...selector.options].some(o=>o.value===s))initial=s}catch{}selector.value=initial;load(initial);loadRepDB();
</script></body></html>
