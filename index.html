<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111312">
<title>FORM — Your workout</title>
<style>
:root{color-scheme:dark;--bg:#121114;--panel:#1d1a20;--line:#37313b;--muted:#aaa0ae;--text:#f6f0f7;--accent:#f5a1cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.3}
header{border-bottom:1px solid var(--line)}.nav{max-width:900px;margin:auto;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--accent)}.workout-select{max-width:60%;min-height:36px;border:1px solid #68465b;border-radius:8px;background:#29232d;color:var(--accent);padding:6px 28px 6px 10px;font-size:13px}main{max-width:900px;margin:auto;padding:24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;letter-spacing:-.7px;margin:0;font-weight:600}.overview{display:flex;gap:18px;color:var(--muted);font-size:12px}.stat strong{color:var(--text);font-weight:600}.stat span{margin-left:4px}
.exercise{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:16px}.exercise-head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.number{height:34px;width:34px;flex-shrink:0;border:1px solid #68465b;color:var(--accent);display:grid;place-items:center;border-radius:9px;font-size:11px;font-weight:650}.exercise h3{font-size:17px;letter-spacing:-.3px;margin:0 0 4px;font-weight:600}.exercise-head p{font-size:11px;color:var(--muted);margin:0}.count{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:11px}
.sets{display:flex;flex-direction:column;gap:8px}.set{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr) 112px 32px;align-items:center;gap:14px;background:#161318;border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .2s}.set.done{border-color:#ac6990;background:#2c202a}.set-top,.fields{display:contents}.set-title{grid-column:1;grid-row:1;font-size:11px;color:var(--muted);font-weight:650}.remove{grid-column:5;grid-row:1;background:none;border:0;color:var(--muted);font-size:22px;min-height:44px;padding:0}.fields label{grid-row:1;color:var(--muted);font-size:10px;min-width:0}.fields label:first-child{grid-column:2}.fields label:last-child{grid-column:3}input{display:block;width:100%;min-width:0;min-height:42px;margin-top:4px;background:#29232d;border:1px solid #483b4a;border-radius:6px;color:var(--text);font-size:18px;padding:8px;appearance:textfield}input::-webkit-inner-spin-button{appearance:none}.complete{grid-column:4;grid-row:1;align-self:end;min-height:42px;margin-bottom:1px;border:1px solid #68465b;background:transparent;color:var(--accent);border-radius:7px;font-size:12px;padding:8px}.done .complete{background:var(--accent);border-color:var(--accent);color:#321526}.add{border:1px dashed #68465b;border-radius:8px;background:transparent;color:var(--accent);min-height:42px;font-size:12px}.add span{font-size:18px;margin-right:7px}.add:hover{background:#30202b;border-color:var(--accent)}footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px;padding:16px 0}#status{color:var(--accent)}.progress{height:3px;background:#37303b;border-radius:4px;margin-top:20px;overflow:hidden}.progress div{background:var(--accent);height:100%;transition:width .25s}#finish-note{color:var(--accent);margin:12px 0 0;font-size:13px}#finish-note:empty{display:none}
@media(max-width:600px){.nav{height:52px;padding:0 16px}main{padding:18px 12px}.intro{align-items:flex-start;flex-direction:column;gap:10px}h1{font-size:22px}.overview{gap:16px}.exercise{padding:14px 10px;margin-top:12px}.exercise-head{gap:9px;margin-bottom:12px}.exercise h3{font-size:16px}.set{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 48px 24px;gap:7px;padding:8px}.set-title{font-size:10px}.complete{font-size:11px;padding:6px 2px}input{padding:7px 5px;font-size:17px}.count{font-size:10px}footer{flex-direction:column;gap:6px}.nav-note{font-size:11px}}

.exercise-name{flex:1;min-width:0}.exercise h3{margin:0}.exercise-toggle{border:0;background:transparent;color:inherit;padding:8px 0;text-align:left;font:inherit;line-height:1.35;overflow-wrap:anywhere;width:100%}.chevron{display:inline-block;font-size:12px;margin-right:6px;color:var(--accent)}.rename{border:1px solid #68465b;border-radius:7px;background:transparent;color:var(--accent);min-width:36px;min-height:36px;font-size:17px;flex-shrink:0}.sets[hidden]{display:none}.exercise.collapsed .exercise-head{margin-bottom:0}.exercise.finished{background:var(--accent);border-color:var(--accent);color:#321526}.finished .number,.finished .rename{color:#321526;border-color:#9b577d}.finished .count,.finished .chevron,.finished .set-title,.finished label,.finished .remove{color:#593047}.finished .set,.finished .set.done{background:#ffffff20;border-color:#a96389}.finished input{background:#ffffff80;color:#321526;border-color:#ac6990}.finished .complete,.finished .done .complete{background:#321526;color:#ffdbef;border-color:#321526}.finished .add{color:#321526;border-color:#9b577d}.finished .add:hover{background:#ffffff40}.finished button:focus-visible,.finished input:focus-visible{outline-color:#321526}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">FORM<span> /</span></div><select id="workout-select" class="workout-select" aria-label="Select workout"><option value="full-body">Full Body</option><option value="upper">Upper</option><option value="lower">Lower</option><option value="full-body-a">Full Body A · Original</option></select></div></header>
<main>
<div class="intro"><h1 id="workout-title">Full Body</h1><div class="overview"><div class="stat"><strong id="exercise-count">0</strong><span>exercises</span></div><div class="stat"><strong id="total">0</strong><span>sets</span></div><div class="stat"><strong id="completed">0</strong><span>done</span></div></div></div>
<div id="exercises"></div>
<div class="progress" role="progressbar" aria-label="Workout completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div>
<p id="finish-note" role="status"></p>
<footer><span>kg · 0 = bodyweight · Single-leg reps are per side</span><span id="status" role="status" aria-live="polite">Changes save on this device</span></footer>
</main>
<script>
'use strict';
const selector=document.getElementById('workout-select');
const status=document.getElementById('status');
const allowed=new Set([...selector.options].map(o=>o.value));
const sessions=new Map();
let workout=[],key='',activeId='',storageOK=true,loading=false;
const escapeHTML=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validExercises(data,completed=false){return Array.isArray(data)&&data.length>0&&data.every(e=>e&&typeof e.name==='string'&&e.name.trim()&&Array.isArray(e.sets)&&e.sets.length>0&&e.sets.every(s=>s&&Number.isInteger(s.reps)&&s.reps>=1&&s.reps<=1000&&Number.isFinite(s.weight)&&s.weight>=0&&s.weight<=2000&&(!completed||typeof s.done==='boolean')));}
async function loadWorkout(id){
 if(loading||!allowed.has(id))return;
 loading=true;selector.disabled=true;status.textContent='Loading workout…';
 try{
  let session=sessions.get(id);
  if(!session){
   const response=await fetch(`workouts/${id}.json`);
   if(!response.ok)throw Error('Template unavailable');
   const template=await response.json();
   if(template.id!==id||typeof template.name!=='string'||!template.name.trim()||!validExercises(template.exercises))throw Error('Invalid template');
   const nextKey=id==='full-body-a'?'form-workout-a-v1':`form-workout-${id}-v1`;
   let exercises=template.exercises.map(e=>({name:e.name,templateName:e.name,collapsed:false,sets:e.sets.map(s=>({reps:s.reps,weight:s.weight,done:false}))})),readable=true;
   try{const raw=localStorage.getItem(nextKey);if(raw){const saved=JSON.parse(raw);if(!validExercises(saved,true)||saved.length!==exercises.length||!saved.every((e,i)=>(e.templateName??e.name)===exercises[i].templateName))throw Error('Invalid saved data');exercises=saved.map((e,i)=>({...e,templateName:exercises[i].templateName,collapsed:e.collapsed===true}));}}
   catch{readable=false;}
   session={name:template.name,exercises,key:nextKey,readable};sessions.set(id,session);
  }
  activeId=id;key=session.key;workout=session.exercises;storageOK=session.readable;
  document.getElementById('workout-title').textContent=session.name;
  selector.value=id;render();
  status.textContent=storageOK?'Changes save on this device':'Saved data unavailable. Changes last only this session.';
  try{localStorage.setItem('form-selected-workout',id);}catch{}
 }catch{
  selector.value=activeId||id;
  status.textContent=location.protocol==='file:'?'Open the GitHub Pages website to load workout files.':'Could not load workout. Your current workout is unchanged. Select a workout to retry.';
 }finally{loading=false;selector.disabled=false;}
}
selector.addEventListener('change',()=>loadWorkout(selector.value));
function save(){if(!storageOK)return;try{localStorage.setItem(key,JSON.stringify(workout));status.textContent='Saved on this device';}catch{status.textContent='Could not save. Keep this page open to retain changes.';}}
function summary(){document.getElementById('exercise-count').textContent=workout.length;const sets=workout.flatMap(e=>e.sets),done=sets.filter(s=>s.done).length;document.getElementById('total').textContent=String(sets.length).padStart(2,'0');document.getElementById('completed').textContent=String(done).padStart(2,'0');const percent=sets.length?Math.round(done/sets.length*100):0;document.getElementById('progress-fill').style.width=percent+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',percent);document.getElementById('finish-note').textContent=sets.length&&done===sets.length?'Workout complete ✓':'';}
function render(focus){const root=document.getElementById('exercises');root.replaceChildren();workout.forEach((exercise,ei)=>{const section=document.createElement('section');section.className='exercise'+(exercise.collapsed?' collapsed':'')+(exercise.sets.every(s=>s.done)?' finished':'');section.setAttribute('aria-labelledby','exercise-'+ei);section.innerHTML=`<div class="exercise-head"><div class="number">${String(ei+1).padStart(2,'0')}</div><div class="exercise-name"><h3 id="exercise-${ei}"><button type="button" id="toggle-${ei}" class="exercise-toggle" aria-expanded="${!exercise.collapsed}" aria-controls="sets-${ei}"><span class="chevron" aria-hidden="true">${exercise.collapsed?'▸':'▾'}</span>${escapeHTML(exercise.name)}</button></h3></div><span class="count">${exercise.sets.length} sets</span><button type="button" class="rename" aria-label="Rename ${escapeHTML(exercise.name)}" title="Rename exercise">✎</button></div><div class="sets" id="sets-${ei}" ${exercise.collapsed?'hidden':''}></div>`;const row=section.querySelector('.sets');
section.querySelector('.exercise-toggle').onclick=event=>{exercise.collapsed=!exercise.collapsed;row.hidden=exercise.collapsed;section.classList.toggle('collapsed',exercise.collapsed);event.currentTarget.setAttribute('aria-expanded',String(!exercise.collapsed));event.currentTarget.querySelector('.chevron').textContent=exercise.collapsed?'▸':'▾';save();};
section.querySelector('.rename').onclick=()=>{const result=prompt('Exercise name',exercise.name);if(result===null)return;const name=result.trim();if(!name||name.length>100){status.textContent='Use an exercise name between 1 and 100 characters.';return;}exercise.name=name;save();render(`toggle-${ei}`);};
exercise.sets.forEach((set,si)=>{const card=document.createElement('div');card.className='set'+(set.done?' done':'');card.innerHTML=`<div class="set-top"><span class="set-title">${String(si+1).padStart(2,'0')}</span><button type="button" class="remove" aria-label="Remove set ${si+1} from ${escapeHTML(exercise.name)}" ${exercise.sets.length===1?'disabled':''}>×</button></div><div class="fields"><label>Reps<input id="reps-${ei}-${si}" aria-label="${escapeHTML(exercise.name)}, set ${si+1}, reps" type="number" min="1" max="1000" step="1" value="${set.reps}" required inputmode="numeric"></label><label>Weight · kg<input aria-label="${escapeHTML(exercise.name)}, set ${si+1}, weight in kilograms" type="number" min="0" max="2000" step="0.1" value="${set.weight}" required inputmode="decimal"></label></div><button type="button" class="complete" aria-label="${escapeHTML(exercise.name)}, set ${si+1}, mark complete" aria-pressed="${set.done}">${set.done?'✓ Done':'○ Done'}</button>`;
card.querySelectorAll('input').forEach((input,fi)=>{input.addEventListener('input',()=>{if(!input.validity.valid)return;set[fi===0?'reps':'weight']=input.valueAsNumber;save();});input.addEventListener('blur',()=>{if(!input.validity.valid){input.value=set[fi===0?'reps':'weight'];status.textContent='Enter valid reps (1–1000) and weight (0–2000 kg).';}});});
card.querySelector('.remove').onclick=()=>{if(exercise.sets.length<=1)return;exercise.sets.splice(si,1);save();render(`add-${ei}`);};card.querySelector('.complete').onclick=event=>{if(![...card.querySelectorAll('input')].every(input=>input.reportValidity()))return;set.done=!set.done;card.classList.toggle('done',set.done);event.currentTarget.textContent=set.done?'✓ Done':'○ Done';event.currentTarget.setAttribute('aria-pressed',String(set.done));section.classList.toggle('finished',exercise.sets.every(s=>s.done));save();summary();};row.append(card);});const add=document.createElement('button');add.type='button';add.id=`add-${ei}`;add.className='add';add.setAttribute('aria-label','Add set to '+exercise.name);add.innerHTML='<span aria-hidden="true">+</span>Add set';add.onclick=()=>{const last=exercise.sets.at(-1);exercise.sets.push({reps:last.reps,weight:last.weight,done:false});save();render(`reps-${ei}-${exercise.sets.length-1}`);};row.append(add);root.append(section);});summary();if(focus)document.getElementById(focus)?.focus();}
let initial='full-body';try{const saved=localStorage.getItem('form-selected-workout');if(allowed.has(saved))initial=saved;}catch{}
selector.value=initial;loadWorkout(initial);
</script>
</body>
</html>
